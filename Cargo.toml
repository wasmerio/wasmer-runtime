[package]
name = "wasmer-workspace"
description = "Wasmer workspace"
publish = false
autoexamples = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
wasmer = { version = "=7.5.0", path = "lib/api", default-features = false }
wasmer-cache = { version = "=7.5.0", path = "lib/cache", optional = true }
wasmer-compiler = { version = "=7.5.0", path = "lib/compiler", features = [
  "compiler",
], optional = true }
wasmer-compiler-cranelift = { version = "=7.5.0", path = "lib/compiler-cranelift", optional = true }
wasmer-compiler-llvm = { version = "=7.5.0", path = "lib/compiler-llvm", optional = true }
wasmer-compiler-singlepass = { version = "=7.5.0", path = "lib/compiler-singlepass", optional = true }
wasmer-middlewares = { version = "=7.5.0", path = "lib/middlewares", optional = true }
wasmer-types = { version = "=7.5.0", path = "lib/types" }
wasmer-wast = { version = "=7.5.0", path = "tests/lib/wast", optional = true }

# Third party dependencies
crossbeam-queue.workspace = true

[workspace]
members = [
  "fuzz",
  "lib/api",
  "lib/api/macro-wasmer-engine-test",
  "lib/cache",
  "lib/compiler-cranelift",
  "lib/compiler-llvm",
  "lib/compiler-singlepass",
  "lib/compiler",
  "lib/derive",
  "lib/middlewares",
  "lib/types",
  "lib/vm",
  "tests/lib/compiler-test-derive",
  "tests/lib/test-generator",
  "tests/lib/wast",
]

[workspace.package]
authors = ["Wasmer Engineering Team <engineering@wasmer.io>"]
edition = "2024"
homepage = "https://wasmer.io/"
license = "MIT"
repository = "https://github.com/wasmerio/wasmer-runtime"
rust-version = "1.99"
version = "7.5.0"

[workspace.dependencies]
# Wasmer-owned crates
shared-buffer = "0.1.4"
loupe = "0.2.0"

# Third-party crates
addr2line = "0.27.1"
anyhow = "1.0"
backtrace = "0.3"
bindgen = { version = "0.73.2", default-features = false }
blake3 = "1.0"
build-deps = "0.1.4"
bytecheck = { version = "0.8.2" }
byteorder = "1.3"
bytes = "1.11.1"
bytesize = "2.3.1"
cc = "1.2.47"
cmake = "0.1.50"
compiletest_rs = "0.11.2"
corosensei = "0.3.0"
cranelift-codegen = { version = "=0.136.5", default-features = false }
cranelift-entity = { version = "=0.136.5", default-features = false }
cranelift-frontend = { version = "=0.136.5", default-features = false }
crc32fast = "1.5.0"
criterion = { version = "0.8.1", default-features = false }
crossbeam-channel = "0.5.15"
crossbeam-queue = "0.3.8"
crossbeam-skiplist = "0.1.3"
dashmap = "6.1.0"
derive_more = { version = "2.0.1", features = ["debug", "display"] }
dynasm = "5.0.0"
dynasmrt = "5.0.0"
enum-iterator = "2.3.0"
enumset = "1.1.0"
fixedbitset = "0.5.7"
fnv = "1.0.3"
futures = "0.3.30"
getrandom = "0.4.1"
gimli = "0.34.0"
glob = "0.3"
hashbrown = "0.17.0"
hex = "0.4"
indexmap = "2"
inkwell = { version = "0.11.0", default-features = false }
itertools = "0.15"
js-sys = "0.3.77"
leb128 = "0.2"
libc = { version = "0.2.178", default-features = false }
libfuzzer-sys = "0.4.0"
libunwind = "1.3.3"
mach2 = "0.7.0"
macho-unwind-info = "0.5.0"
memmap2 = { version = "0.9.9" }
more-asserts = "0.3.1"
num_enum = "0.7.3"
object = { version = "0.41.0", features = ["read", "write"] }
parking_lot = "0.13.0"
paste = "1.0.15"
phf = "0.14.0"
pretty_assertions = "1.4.0"
proc-macro-error2 = "2.0.1"
proc-macro2 = "1"
quote = "1.0.20"
rand = "0.10.1"
rangemap = "1.7.1"
rayon = "1.7.0"
regalloc2 = "0.15.1"
region = "4.0"
reqwest = { version = "0.13.0", default-features = false }
rkyv = { version = "0.8.13", features = ["indexmap-2", "bytes-1"] }
symbolic-demangle = { version = "13", default-features = false, features = [
  "rust",
  "cpp",
  "msvc",
] }
scopeguard = "1.1.0"
self_cell = "1.0"
serde = { version = "1", default-features = false }
serde-wasm-bindgen = "0.6.5"
serde_bytes = { version = "0.11" }
serde_derive = "1"
serial_test = { version = "4.0.1", default-features = false }
sha2 = "0.11.0"
smallvec = "1.6"
strum = { version = "0.28", features = ["derive"] }
syn = { version = "3", default-features = false }
tar = "0.4.40"
target-lexicon = { version = "0.13.3", default-features = false }
tempfile = "3.6.0"
test-log = { version = "0.2", default-features = false }
thiserror = "2.0.17"
# MIO 1.0 starts at tokio version 1.39, hence the minimum requirement.
tokio = { version = "1.39.0", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
trybuild = "1.0.11"
ureq = "3.5.2"
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4.70"
wasm-bindgen-test = "0.3.70"
wasm-smith = "0.263.0"
wasmparser = { version = "0.263.0", default-features = false, features = [
  "validate",
  "features",
  "simd",
] }
wasmprinter = "0.263.0"
wasmtime = { version = "50.0.2", default-features = false, features = [
  "cranelift",
  "runtime",
  "std",
] }
wast = "263.0.0"
wat = "1.263.0"
which = "8.0.0"
windows-sys = { version = "0.61.2", default-features = false }
xz = "0.1.0"
zip = { version = "9.0.4", default-features = false }
libwild = { version = "0.11.0", default-features = false, features = ["macho"] }

[build-dependencies]
test-generator = { path = "tests/lib/test-generator" }
build-deps.workspace = true
anyhow.workspace = true
glob.workspace = true

[dev-dependencies]
anyhow.workspace = true
bytesize.workspace = true
criterion = { workspace = true, features = ["csv_output"] }
serial_test = { workspace = true, default-features = false }
compiler-test-derive = { path = "tests/lib/compiler-test-derive" }
tempfile.workspace = true
ureq.workspace = true
# For logging tests using the `RUST_LOG=debug` when testing
test-log = { workspace = true, default-features = false, features = ["trace"] }
tracing = { workspace = true, default-features = false, features = ["log"] }
tracing-subscriber = { workspace = true, default-features = false, features = [
  "env-filter",
  "fmt",
] }
reqwest = { workspace = true, features = ["blocking", "rustls"] }
itertools.workspace = true
wasmtime.workspace = true

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
wasmer = { version = "=7.5.0", path = "lib/api", default-features = false, features = [
  "compiler",
  "singlepass",
  "sys",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
wasmer = { version = "=7.5.0", path = "lib/api", default-features = false, features = [
  "compiler",
  "sys",
  "v8",
] }

[features]
# Select compiler features explicitly for examples and integration tests.
default = ["wat", "wast", "cache", "middlewares"]
# backend means that the `wasmer` crate will be compiled with the `wasmer-compiler`.
# That means: that is able to execute modules
backend = []

# Enable the V8 backend (using it as default only if it is the only backend enabled)
v8 = ["wasmer/v8"]
# Enable V8 and explicitly select it as the default backend.
v8-default = ["v8", "wasmer/v8-default"]

engine = []
cache = ["wasmer-cache"]
wast = ["wasmer-wast"]
wat = ["wasmer/wat"]
compiler = ["wasmer/compiler", "backend", "wasmer-compiler/translator"]
singlepass = ["compiler", "wasmer-compiler-singlepass", "wasmer/singlepass"]
cranelift = ["compiler", "wasmer-compiler-cranelift", "wasmer/cranelift"]
llvm = ["compiler", "wasmer-compiler-llvm", "wasmer/llvm"]
middlewares = ["wasmer-middlewares"]
wasmer-artifact-load = ["wasmer-compiler/wasmer-artifact-load"]
wasmer-artifact-create = ["wasmer-compiler/wasmer-artifact-create"]
static-artifact-load = ["wasmer-compiler/static-artifact-load"]
static-artifact-create = ["wasmer-compiler/static-artifact-create"]
experimental-async = ["wasmer/experimental-async"]

# Testing features
test-singlepass = ["singlepass"]
test-cranelift = ["cranelift"]
test-llvm = ["llvm"]

test-engine = ["test-generator/test-engine"]

# Specifies that we're running in coverage testing mode. This disables tests
# that raise signals because that interferes with tarpaulin.
coverage = []

[profile.release-debug]
inherits = "release"
debug = true

# Enable optimizations for a few crates, even for debug builds.
# This greatly speeds up using debug builds, because these crates are extremely
# slow without optimizations.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.rkyv]
opt-level = 3
[profile.dev.package.wasmer-types]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3

[[bench]]
name = "run"
harness = false

[[bench]]
name = "compile"
harness = false

[[bench]]
name = "deserialize_modules"
harness = false

[[bench]]
name = "static_and_dynamic_functions"
harness = false

[[bench]]
name = "host_guest"
harness = false
required-features = ["wat", "llvm"]

[[bench]]
name = "import_functions"
harness = false

[[bench]]
name = "typed_call"
harness = false
required-features = ["singlepass"]

