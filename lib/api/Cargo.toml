[package]
name = "wasmer"
description = "High-performance WebAssembly runtime"
categories = ["wasm"]
keywords = ["wasm", "webassembly", "runtime", "vm"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

#####
# This crate comes in 3 major flavors:
#
# - `sys`, where `wasmer` will be compiled to a native executable
#    which provides compilers, engines, a full VM etc.
# - `v8`, where `wasmer` will be compiled to a native executable
#    using `v8` as a backend.
# - `js`, where `wasmer` will be compiled to WebAssembly to run in a
#   JavaScript host.
#####

# Shared dependencies.
[dependencies]
# - Mandatory shared dependencies.
indexmap.workspace = true
thiserror.workspace = true
more-asserts.workspace = true
bytes.workspace = true
tracing = { workspace = true, default-features = true }
# - Optional shared dependencies.
wat = { workspace = true, optional = true }
symbolic-demangle = { workspace = true, optional = true }
shared-buffer.workspace = true

loupe = { workspace = true, optional = true, features = [
  "indexmap",
  "enable-indexmap",
] }
paste.workspace = true
derive_more = { workspace = true, features = ["from", "debug", "unwrap"] }

# Dependencies and Development Dependencies for `sys`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# - Mandatory dependencies for `sys`.
wasmer-vm = { path = "../vm", version = "=7.5.0", optional = true }
wasmer-compiler = { path = "../compiler", version = "=7.5.0", optional = true }
wasmer-derive = { path = "../derive", version = "=7.5.0" }
wasmer-types = { path = "../types", version = "=7.5.0" }
target-lexicon = { workspace = true, default-features = false }
# - Optional dependencies for `sys`.
wasmer-compiler-singlepass = { path = "../compiler-singlepass", version = "=7.5.0", optional = true }
wasmer-compiler-cranelift = { path = "../compiler-cranelift", version = "=7.5.0", optional = true }
wasmer-compiler-llvm = { path = "../compiler-llvm", version = "=7.5.0", optional = true }
futures = { workspace = true, optional = true }
smallvec = { workspace = true, optional = true }
dashmap.workspace = true
itertools.workspace = true

wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasmparser = { workspace = true, default-features = false, optional = true }
rkyv.workspace = true

# - Mandatory dependencies for `sys` on Windows.
[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
windows-sys.workspace = true
# - Development Dependencies for `sys`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wat.workspace = true
tempfile.workspace = true
anyhow.workspace = true
macro-wasmer-engine-test = { version = "7.5.0", path = "./macro-wasmer-engine-test" }
futures = "0.3"
tokio = { workspace = true, features = ["full"] }
crossbeam-channel.workspace = true

# Dependencies and Develoment Dependencies for `js`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# - Mandatory dependencies for `js`.
crossbeam-skiplist.workspace = true
wasmer-types = { path = "../types", version = "=7.5.0", default-features = false, features = [
  "std",
] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys.workspace = true
wasmer-derive = { path = "../derive", version = "=7.5.0" }
wasmer-compiler = { path = "../compiler", version = "=7.5.0" }
# - Optional dependencies for `js`.
wasmparser = { workspace = true, default-features = false, optional = true }
serde-wasm-bindgen.workspace = true
serde.workspace = true
target-lexicon.workspace = true

# - Development Dependencies for `js`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wat.workspace = true
anyhow.workspace = true
futures.workspace = true
wasm-bindgen-test.workspace = true
macro-wasmer-engine-test = { version = "7.5.0", path = "./macro-wasmer-engine-test" }

# Specific to `js`.
#
# `wasm-opt` is on by default in for the release profile, but it can be
# disabled by setting it to `false`
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["sys-default", "async"]
# `std` and `core` gate nothing: the crate always uses `std`. They are kept
# so that manifests naming them still build.
std = []
core = []
artifact-size = [
  "dep:loupe",
  "wasmer-vm/artifact-size",
  "wasmer-compiler/artifact-size",
]

# Features for `sys`.
sys = ["std", "dep:wasmer-vm", "dep:wasmer-compiler", "dep:smallvec"]
sys-default = ["sys", "wat", "cranelift", "demangle"]

# Improve native stack traces without forcing the demanglers into browser builds.
demangle = ["dep:symbolic-demangle"]

# The `sys` runtime without a compiler, which loads precompiled artifacts.
headless = ["sys"]

# Async calls into WebAssembly and async host functions (see docs/ASYNC.md).
async = ["dep:futures"]

# Experimental host-triggered interruption support
experimental-host-interrupt = ["wasmer-vm/experimental-host-interrupt"]

# - Compilers.
compiler = [
  "sys",
  "dep:wasmer-compiler",
  "wasmer-compiler/translator",
  "wasmer-compiler/compiler",
]
singlepass = ["compiler", "wasmer-compiler-singlepass"]
cranelift = ["compiler", "wasmer-compiler-cranelift"]
llvm = ["compiler", "wasmer-compiler-llvm"]

# --- Enable the v8 backend and use it as default backend.
v8 = [
  "wasm-c-api",
  "std",
  "dep:bindgen",
  "dep:tar",
  "dep:ureq",
  "dep:which",
  "dep:xz",
]
# --- Enable the v8 backend and use it as defaul backend only if it is the only one enabled.
v8-default = ["v8", "wat"]

wasm-c-api = ["wasm-types-polyfill"]

# Features for `js`.
js = ["wasm-bindgen", "wasm-bindgen-futures", "js-sys"]
js-default = ["js", "std", "wasm-types-polyfill"]

wasm-types-polyfill = ["wasmparser"]
wat = ["dep:wat", "wasmparser"]

js-serializable-module = []

# Optional
enable-serde = [
  "wasmer-vm/enable-serde",
  "wasmer-compiler/enable-serde",
  "wasmer-types/enable-serde",
]

# AddressSanitizer support
sanitizer = ["wasmer-vm/sanitizer"]

# Use the signal-free trap-handler backend (no OS signal infrastructure required).
# Enable when targeting ZK virtual machines, embedded RTOSes, or similar
# environments that provide std but lack Unix/Windows signal delivery.
# Does NOT imply no_std support.
baremetal = ["wasmer-vm/baremetal"]

wasmer-artifact-load = ["wasmer-compiler/wasmer-artifact-load"]
wasmer-artifact-create = ["wasmer-compiler/wasmer-artifact-create"]
static-artifact-load = ["wasmer-compiler/static-artifact-load"]
static-artifact-create = ["wasmer-compiler/static-artifact-create"]

# Only the `v8` backend has a build script that does anything.
[build-dependencies]
tar = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
which = { workspace = true, optional = true }
xz = { workspace = true, optional = true }

[target.'cfg(not(target_env = "musl"))'.build-dependencies]
bindgen = { workspace = true, optional = true, default-features = true }

# musl does not support dlopen/dlsym functionality used by the bindgen (using libclang).
[target.'cfg(target_env = "musl")'.build-dependencies]
bindgen = { workspace = true, optional = true, default-features = false, features = [
  "logging",
  "prettyplease",
  "static",
] }

[package.metadata.docs.rs]
features = [
  "compiler",
  "core",
  "cranelift",
  "singlepass",
  "static-artifact-create",
  "static-artifact-load",
  "sys",
  "sys-default",
  "wasmer-artifact-create",
  "wasmer-artifact-load",
]
rustc-args = ["--cfg", "docsrs"]
