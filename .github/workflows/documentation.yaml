name: Documentation
on:
  push:
    branches:
      - "main"
    paths:
      - "lib/**"
jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/load_toolchain
        id: load_toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.load_toolchain.outputs.rust_toolchain }}
      - name: Install zlib
        run: sudo apt-get update -y && sudo apt-get install -y zlib1g-dev
      - name: Install LLVM
        shell: bash
        run: |
          mkdir -p "$LLVM_DIR"
          curl --retry 3 --proto '=https' --tlsv1.2 -fsSL "$LLVM_URL" |
            tar -I 'zstd --long=30' -xf - --strip-components=1 -C "$LLVM_DIR"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_231_PREFIX=$LLVM_DIR" >> "$GITHUB_ENV"
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm-23
          LLVM_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-Linux-X64.tar.zst"
      - name: Validate documentation
        run: >-
          cargo doc --workspace --exclude wasmer-c-api --release --no-deps --document-private-items --locked --features cranelift,llvm,singlepass,wasmer-artifact-create,static-artifact-create,wasmer-artifact-load,static-artifact-load,wasmer/experimental-async,wasmer/experimental-host-interrupt
