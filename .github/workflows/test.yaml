name: test-sys
on:
  push:
    branches:
      - main
      - edge
      - "with-ci-.*"
  pull_request:
  workflow_dispatch:
# Automatically cancel previous workflow runs when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  RUST_BACKTRACE: 1
  NEXTEST_PROFILE: "ci"
  RUSTUP_WINDOWS_PATH_ADD_BIN: 1
  S3_CACHE_VERSION: "4"
  # Job containers do not inherit the runner pod env; keep equal to the aux pod value.
  RUNS_ON_S3_BUCKET_CACHE: gha-cache-ci-aux-eu-west-3-public
  RUNS_ON_AWS_REGION: eu-west-3
  ARTIFACT_FEATURES: wasmer-artifact-create,static-artifact-create,wasmer-artifact-load,static-artifact-load
jobs:
  dependency_cooldown:
    name: Dependency cooldown
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Check for eligible dependency updates
        run: cargo +nightly update
  lint:
    name: Code lint
    runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/load_toolchain
        id: load_toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.load_toolchain.outputs.rust_toolchain }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install libtinfo
        shell: bash
        run: |
          sudo apt-get update -y && sudo apt-get install -y libtinfo6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: false
      - run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
      - name: Install LLVM (Linux)
        # $HOME instead of /opt: not root-writable on hardened ARC runners
        shell: bash
        run: |
          LLVM_DIR="$HOME/llvm-23"
          mkdir -p "$LLVM_DIR"
          curl --retry 3 --proto '=https' --tlsv1.2 -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-Linux-X64.tar.zst |
            tar -I 'zstd --long=30' -xf - --strip-components=1 -C "$LLVM_DIR"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_231_PREFIX=$LLVM_DIR" >> "$GITHUB_ENV"
      - name: Install taplo
        run: |
          mkdir -p $HOME/.local/bin
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gzip -d - | install -m 755 /dev/stdin $HOME/.local/bin/taplo
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Cache
        uses: runs-on/cache@v5
        with:
          path: &cargo-cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ./target/*
          key: cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-lint-linux-x64-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting
        shell: bash
        run: |
          yamlfmt -lint .github
          taplo format --check --diff
      - name: Lint Rust
        shell: bash
        run: |
          cargo fmt --all -- --check
          native_features="cranelift,singlepass,llvm,$ARTIFACT_FEATURES"
          cargo clippy --workspace --examples --features "$native_features,experimental-async,wasmer/experimental-host-interrupt" --locked -- -D clippy::all
          cargo clippy -p wasmer-bin-fuzz --features "$native_features" --locked -- -D clippy::all
      - name: Lint JavaScript backend
        run: cargo clippy --target wasm32-unknown-unknown -p wasmer --no-default-features --features js-default --locked -- -D clippy::all
      - name: Assert no files have changed
        shell: bash
        run: |
          git status
          ! [[ $(git status -s) ]]
  cargo_deny:
    name: cargo-deny
    runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: error
  test_nodejs:
    name: NodeJS
    runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/load_toolchain
        id: load_toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.load_toolchain.outputs.rust_toolchain }}
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Cache
        uses: runs-on/cache@v5
        with:
          path: *cargo-cache-paths
          key: cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-test-js-${{ hashFiles('Cargo.lock') }}
      - name: Test JavaScript backend
        working-directory: lib/api
        run: wasm-pack test --node -- --no-default-features --features js-default,wat,experimental-async,js-serializable-module
  test_interpreter_api:
    name: API (V8) - ${{ matrix.metadata.build }}
    runs-on: ${{ matrix.metadata.build == 'linux-x64' && (github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64') || matrix.metadata.os }}
    strategy:
      fail-fast: false
      matrix:
        metadata:
          - build: linux-x64
            os: ubuntu-22.04
          - build: macos-arm
            os: macos-15
          - build: windows-x64
            os: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup MSVC (Windows)
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.metadata.build == 'windows-x64'
      - uses: ./.github/actions/load_toolchain
        id: load_toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.load_toolchain.outputs.rust_toolchain }}
          components: clippy
      - name: Install Nextest
        uses: taiki-e/install-action@nextest
      - name: Install Ninja, Clang and binutils on Ubuntu
        if: matrix.metadata.build == 'linux-x64'
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build clang binutils
      - name: Install Ninja and LLVM on macOS
        if: matrix.metadata.build == 'macos-arm'
        run: |
          brew install ninja zstd
          LLVM_DIR="$RUNNER_TEMP/llvm-23"
          mkdir -p "$LLVM_DIR"
          curl --retry 3 --proto '=https' --tlsv1.2 -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-macOS-ARM64.tar.zst" |
            zstd --long=30 -dc | tar -xf - --strip-components=1 -C "$LLVM_DIR"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"
      - name: Install Ninja on Windows
        if: matrix.metadata.build == 'windows-x64'
        run: choco install ninja
      - name: Delete unwanted link to stop it from interfering (Windows)
        shell: bash
        run: rm /usr/bin/link.exe
        if: matrix.metadata.build == 'windows-x64'
      - name: Cache
        if: startsWith(runner.name, 'aux-')
        uses: runs-on/cache@v5
        with:
          path: *cargo-cache-paths
          key: cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-test-v8-api-${{ matrix.metadata.build }}-${{ hashFiles('Cargo.lock') }}
      - name: Lint V8 API
        run: cargo clippy -p wasmer --no-default-features --features v8-default --locked -- -D clippy::all
      - name: Test V8 API
        run: cargo nextest run -p wasmer --release --no-default-features --features v8-default --locked
  test_store_context_miri:
    name: Store context under Miri
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri, rust-src
      # Build Miri's sysroot as its own step: it needs `rust-src`, it takes a
      # few minutes, and doing it here keeps a sysroot problem from being
      # reported as a test failure. `+nightly` throughout, since
      # rust-toolchain.toml pins a stable channel for this directory and that
      # overrides the default the toolchain action sets.
      - name: Prepare the Miri sysroot
        run: cargo +nightly miri setup
      # These tests replay the store context's borrow flow without executing
      # any Wasm, so Miri can check that a store re-acquired within a nested
      # call does not invalidate the borrow its caller still holds.
      - name: Borrow provenance of the store context
        run: cargo +nightly miri test -p wasmer --features sys --lib borrow_provenance
  build_linux_riscv64:
    name: WAST tests - linux-riscv64
    runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Cache
        uses: runs-on/cache@v5
        with:
          path: ./target/*
          key: cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-wast-tests-linux-riscv64-${{ hashFiles('Cargo.lock') }}
      - name: Build cross image
        run: docker build -t wasmer/riscv64 "$GITHUB_WORKSPACE/.github/cross-linux-riscv64/"
      - name: Run RISC-V tests
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$GITHUB_WORKSPACE:/project" -w /project wasmer/riscv64 \
            cargo test --target riscv64gc-unknown-linux-gnu --release --features "cranelift,$ARTIFACT_FEATURES" --locked
  test:
    name: ${{ matrix.stage.description }} - ${{ matrix.metadata.build }}
    runs-on: ${{ (matrix.metadata.build == 'linux-x64' || matrix.metadata.build == 'linux-musl') && (github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64') || matrix.metadata.build == 'linux-arm64' && (github.event_name == 'pull_request' && 'aux-pub-16cpu-arm64' || 'aux-pub-trusted-16cpu-arm64') || matrix.metadata.os }}
    strategy:
      fail-fast: false
      matrix:
        stage:
          - key: test-all
            description: All tests
          - key: check-compilers-only-std
            description: Compilers (std only)
          - key: check-baremetal
            description: VM (baremetal)
          - key: test-examples
            description: Examples
          - key: check-api-features
            description: API (sys)
        metadata:
          - build: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            v8: true
            llvm_url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-Linux-X64.tar.zst"
          - build: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            llvm_url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-Linux-ARM64.tar.zst"
          - build: macos-arm
            os: macos-15
            target: aarch64-apple-darwin
            v8: true
            llvm_url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-macOS-ARM64.tar.zst"
          - build: linux-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            container: "alpine:edge"
            v8: true
        include:
          - stage:
              key: test-all
              description: All tests
            metadata:
              build: windows-x64
              os: windows-2022
              target: x86_64-pc-windows-msvc
          - stage:
              key: check-baremetal
              description: VM (baremetal)
            metadata:
              build: windows-x64
              os: windows-2022
              target: x86_64-pc-windows-msvc
    container:
      image: ${{ matrix.metadata.container }}
      volumes:
        - /usr/local:/host/usr/local
    env:
      CARGO_BUILD_TARGET: ${{ matrix.metadata.target }}
      COMPILERS: cranelift,singlepass,llvm
      TEST_V8: ${{ matrix.metadata.v8 }}
    steps:
      - name: Set up git on musl
        if: matrix.metadata.build == 'linux-musl'
        run: |
          apk update
          apk add git
      - uses: actions/checkout@v6
        with:
          submodules: true
      # Saves ~21 GiB
      - name: Clean up disk space (container)
        run: |
          rm -rf /__t/*
          rm -rf /host/usr/local/.ghcup
          rm -rf /host/usr/local/lib/android
        if: startsWith(matrix.metadata.build, 'linux') && matrix.metadata.container != ''
      # Saves ~16 GiB
      - name: Clean up disk space (native)
        run: |
          sudo rm -rf /__t/*
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
        if: startsWith(matrix.metadata.build, 'linux') && matrix.metadata.container == ''
      - name: Set up libstdc++ on Linux
        if: matrix.metadata.build == 'linux-x64'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --allow-downgrades libstdc++6
          sudo apt-get install --reinstall g++
      - name: Install build dependencies and LLVM on musl
        if: matrix.metadata.build == 'linux-musl'
        run: ./scripts/alpine-linux-install-deps.sh
      - name: Setup MSVC (Windows)
        if: matrix.metadata.build == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Remove Git's link.exe to avoid shadowing MSVC (Windows)
        if: matrix.metadata.build == 'windows-x64'
        shell: bash
        run: rm -f /usr/bin/link.exe
      - uses: ./.github/actions/load_toolchain
        id: load_toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.load_toolchain.outputs.rust_toolchain }}
          target: ${{ matrix.metadata.target }}
      - name: Install Nextest
        if: matrix.stage.key == 'test-all'
        uses: taiki-e/install-action@nextest
      - name: Install zstd on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install zstd
      - name: Install LLVM
        shell: bash
        if: matrix.metadata.llvm_url && (matrix.stage.key == 'test-all' || matrix.stage.key == 'test-examples' || matrix.stage.key == 'check-api-features')
        env:
          LLVM_URL: ${{ matrix.metadata.llvm_url }}
        run: |
          LLVM_DIR="$PWD/.llvm"
          mkdir -p "$LLVM_DIR"
          curl --retry 3 --proto '=https' --tlsv1.2 -fsSL "$LLVM_URL" |
            zstd --long=30 -dc | tar -xf - --strip-components=1 -C "$LLVM_DIR"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_231_PREFIX=$LLVM_DIR" >> "$GITHUB_ENV"
      - name: Cache
        if: startsWith(runner.name, 'aux-')
        uses: runs-on/cache@v5
        with:
          path: *cargo-cache-paths
          key: cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-wasmer-test-${{ matrix.stage.key }}-${{ matrix.metadata.build }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache (R2, non-aux runners)
        if: ${{ !startsWith(runner.name, 'aux-') }}
        uses: whywaita/actions-cache-s3@v2
        with:
          path: |
            ~/.cargo/*
            ./target/*
          key: cache-v${{ env.S3_CACHE_VERSION }}-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-wasmer-test-${{ matrix.stage.key }}-${{ matrix.metadata.build }}
          aws-s3-bucket: wasmer-rust-artifacts-cache
          aws-access-key-id: ${{ secrets.CLOUDFLARE_ARTIFACTS_CACHE_ACCESS_TOKEN }}
          aws-secret-access-key: ${{ secrets.CLOUDFLARE_ARTIFACTS_CACHE_ACCESS_KEY }}
          aws-region: auto
          aws-endpoint: https://1541b1e8a3fc6ad155ce67ef38899700.r2.cloudflarestorage.com
          aws-s3-bucket-endpoint: false
          aws-s3-force-path-style: true
      - name: Run workspace tests and doctests
        if: matrix.stage.key == 'test-all'
        shell: bash
        env:
          TEST_PLATFORM: ${{ matrix.metadata.build }}
        run: |
          args=(--workspace --release --locked)
          features="$ARTIFACT_FEATURES,experimental-async,wasmer/experimental-host-interrupt"
          if [[ "$TEST_PLATFORM" == windows-x64 ]]; then
            # Use V8 as the default backend on Windows, as the Makefile did.
            features+=,v8-default
            args+=(--no-default-features --exclude wasmer-bin-fuzz
              --exclude wasmer-compiler-cranelift --exclude wasmer-compiler-singlepass
              --exclude wasmer-compiler-llvm)
          else
            features+=,"$COMPILERS"
            if [[ "$TEST_V8" == true ]]; then
              features+=,v8
            fi
          fi
          cargo nextest run "${args[@]}" --features "$features"
          cargo test --doc "${args[@]}" --features "$features"
      - name: Check compilers with std only
        if: matrix.stage.key == 'check-compilers-only-std'
        shell: bash
        run: |
          cargo check -p wasmer-compiler-cranelift --no-default-features --features std --locked
          cargo check -p wasmer-compiler-singlepass --no-default-features --features std --locked
      - name: Check baremetal VM
        if: matrix.stage.key == 'check-baremetal'
        run: cargo check -p wasmer-vm --features baremetal --locked
      - name: Test examples
        if: matrix.stage.key == 'test-examples'
        shell: bash
        run: |
          features="$COMPILERS,$ARTIFACT_FEATURES"
          if [[ "$TEST_V8" == true ]]; then
            features+=,v8
          fi
          cargo test -p wasmer-workspace --examples --features "$features" --locked
      - name: Check sys API features
        if: matrix.stage.key == 'check-api-features'
        run: cargo check -p wasmer --features "$COMPILERS,$ARTIFACT_FEATURES,artifact-size,core,enable-serde" --locked
  ci_success:
    name: Tests CI
    runs-on: ${{ github.event_name == 'pull_request' && 'aux-pub-16cpu-amd64' || 'aux-pub-trusted-16cpu-amd64' }}
    needs:
      - lint
      - cargo_deny
      - test_nodejs
      - test_interpreter_api
      - test_store_context_miri
      - build_linux_riscv64
      - test
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - name: Required jobs passed
        run: echo "All required jobs passed"
